server {
    server_name snip.domain.tld;
    root /var/www/snip/htdocs;
    index  index.php;

#   access_log /var/log/nginx/localhost.access_log combined;
#   error_log /var/log/nginx/localhost.error_log info;

    location / {
        try_files $uri /index.php;
    }

    location ~ \.php$ {
        return 444;
    }

    location = /index.php {
        # fastcgi_pass unix:/var/run/php-fpm/php-fpm.sock;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_split_path_info ^(.+\.php)(.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}

# alternatively:

server {
    server_name snip.domain;
    root /var/www/vhosts/snip.domain/httpdocs;
    index index.php;

    error_log /var/log/nginx/snip.domain.error.log;
    access_log /var/log/nginx/snip.domain.access.log;

    # no caching
    expires 0;

    if ($request_uri !~* ^/(static|favicon\.ico|robots\.txt))
    {
        rewrite ^/(.*)$ /index.php?/$1 last;
        break;
    }

    location ~* \.php$ {
        include fastcgi_params;
        fastcgi_pass unix://var/lib/php5/php5-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(.*)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}


# Configuration example for the uploads folder, to be able to serve the files
location /uploads/ {
    autoindex off;
    try_files $uri $uri/ =404;
}

# Block script execution in the uploads folder
location ~* /uploads/.*\.(php|cgi|pl|py|sh)$ {
    return 403;
}


# ---------------------------------------------------------------------------
# Reverse proxy example: publish SNIP below https://example.com/snip/
#
# SNIP itself listens on http://127.0.0.1:8075/.
#
# In application/config/snip.php:
#   $config['base_url'] = 'auto';
#   $config['base_url_trusted_proxies'] = '127.0.0.1'; # or leave empty
#
# The trailing slash after the upstream address is essential: it strips
# /snip/ before the request reaches SNIP. X-Forwarded-Prefix tells SNIP to
# generate URLs that include /snip/ again.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name example.com;

    # Required for HTTPS - uncomment and adjust:
    # ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    client_max_body_size 8m;   # SNIP's default upload limit is 2 MB

    # Add the trailing slash if the visitor used /snip
    location = /snip {
        return 301 /snip/;
    }

    location /snip/ {
        # The trailing slash is important: it removes /snip/ before the
        # request is forwarded, so SNIP's router still sees /view/..., etc.
        proxy_pass http://127.0.0.1:8075/;

        proxy_http_version 1.1;
        proxy_set_header Host               $http_host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $http_host;
        proxy_set_header X-Forwarded-Prefix /snip;

        # If a CDN / tunnel is in front of this nginx and already sets these,
        # forward its values instead of overwriting them:
        #   proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        #   proxy_set_header X-Forwarded-Host  $http_x_forwarded_host;

        # Let SNIP generate all URLs (including redirects) itself.
        proxy_redirect off;
    }
}

# For a sub-domain instead (https://snip.example.com/ -> 127.0.0.1:8075),
# omit X-Forwarded-Prefix and pass the upstream without a trailing slash:
#
#   location / {
#       proxy_pass http://127.0.0.1:8075;
#       proxy_set_header Host              $http_host;
#       proxy_set_header X-Forwarded-Proto $scheme;
#       proxy_set_header X-Forwarded-Host  $http_host;
#   }
#
# If SNIP is served by nginx + PHP-FPM on the internal machine too, make sure
# the forwarded headers reach PHP (nginx normally forwards request headers,
# but an explicit mapping is harmless):
#
#   fastcgi_param HTTP_X_FORWARDED_PROTO  $http_x_forwarded_proto;
#   fastcgi_param HTTP_X_FORWARDED_HOST   $http_x_forwarded_host;
#   fastcgi_param HTTP_X_FORWARDED_PREFIX $http_x_forwarded_prefix;
